[package]
name = "mc-api"
description = "Music Cloud HTTP API"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/moshms/api"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.23"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
figment = { version = "0.10", features = ["env"] }
form_urlencoded = "1"
futures-util = "0.3"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
metrics = "0.24"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "macros"] }
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "fs", "io-util", "sync", "process"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tonic = "0.14"
tonic-health = "0.14"
tower-http = { version = "0.6", features = ["trace", "timeout", "set-header"] }
tracing = "0.1"
uuid = { version = "1", features = ["v7", "serde"] }

mc-auth = { git = "ssh://git@github.com/moshms/core.git", tag = "v0.3.3" }
mc-authz = { git = "ssh://git@github.com/moshms/core.git", tag = "v0.3.3" }
mc-core = { git = "ssh://git@github.com/moshms/core.git", tag = "v0.3.3" }
mc-crypto = { git = "ssh://git@github.com/moshms/core.git", tag = "v0.3.3" }
mc-db = { git = "ssh://git@github.com/moshms/core.git", tag = "v0.3.3" }
mc-jobs = { git = "ssh://git@github.com/moshms/core.git", tag = "v0.3.3" }
mc-media = { git = "ssh://git@github.com/moshms/core.git", tag = "v0.3.3" }
mc-proto = { git = "ssh://git@github.com/moshms/core.git", tag = "v0.3.3" }
mc-runtime = { git = "ssh://git@github.com/moshms/core.git", tag = "v0.3.3" }
mc-scanner = { git = "ssh://git@github.com/moshms/core.git", tag = "v0.3.3" }
mc-storage = { git = "ssh://git@github.com/moshms/core.git", tag = "v0.3.3" }
mc-telemetry = { git = "ssh://git@github.com/moshms/core.git", tag = "v0.3.3", features = ["metrics"] }
